<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio — Michail Tjhang | Full-Stack Web Developer</title>
    <meta name="description" content="Portfolio of Michail Tjhang, Full-Stack Web Developer specializing in Laravel, Next.js and React.js.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           CSS VARIABLES
        ============================================================ */
        :root {
            --primary:      #0f172a;
            --primary-mid:  #1e293b;
            --accent:       #14b8a6;
            --accent-dark:  #0d9488;
            --accent-light: #ccfbf1;
            --text:         #1e293b;
            --text-muted:   #64748b;
            --border:       #e2e8f0;
            --bg-page:      #f1f5f9;
            --bg-light:     #f8fafc;
            --white:        #ffffff;
        }

        /* ============================================================
           RESET & BASE
        ============================================================ */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 9.5pt;
            color: var(--text);
            background: var(--bg-page);
            line-height: 1.5;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        /* ============================================================
           PRINT STYLES
        ============================================================ */
        @media print {
            html, body {
                width: 210mm !important;
                height: auto !important;
                background: white !important;
                margin: 0 !important;
                padding: 0 !important;
                overflow: visible !important;
            }
            .no-print { display: none !important; }
            .pages-wrapper {
                padding: 0 !important;
                margin: 0 !important;
                gap: 0 !important;
                display: block !important;
            }
            .pdf-page {
                width: 210mm !important;
                height: 297mm !important;
                max-height: 297mm !important;
                box-sizing: border-box !important;
                margin: 0 !important;
                padding: 0 !important;
                box-shadow: none !important;
                border-radius: 0 !important;
                border: none !important;
                overflow: hidden !important;
                display: flex !important;
                flex-direction: column !important;
                justify-content: space-between !important;
                page-break-after: always !important;
                break-after: page !important;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }
            .pdf-page:last-child {
                page-break-after: avoid !important;
                break-after: avoid !important;
            }
            @page {
                size: A4 portrait;
                margin: 0;
            }
        }

        /* ============================================================
           PRINT BAR (screen only)
        ============================================================ */
        .print-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: var(--primary);
            color: white;
            padding: 11px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 9999;
            box-shadow: 0 2px 16px rgba(0,0,0,0.4);
            gap: 12px;
        }
        .print-bar-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .print-bar-logo {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center top;
            border: 2px solid var(--accent);
        }
        .print-bar h2 {
            font-size: 13px;
            font-weight: 600;
            color: white;
        }
        .print-bar p {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 1px;
        }
        .print-bar-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .btn-print {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 0.3px;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-print:hover { background: var(--accent-dark); transform: translateY(-1px); }
        .btn-back {
            background: rgba(255,255,255,0.08);
            color: #94a3b8;
            border: 1px solid rgba(255,255,255,0.15);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
            text-decoration: none;
        }
        .btn-back:hover { background: rgba(255,255,255,0.12); color: white; }

        /* Pages wrapper */
        .pages-wrapper {
            padding: 70px 0 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        /* ============================================================
           A4 PAGE BASE
        ============================================================ */
        .pdf-page {
            width: 210mm;
            height: 297mm;
            max-height: 297mm;
            background: white;
            box-shadow: 0 4px 32px rgba(0,0,0,0.12), 0 1px 6px rgba(0,0,0,0.08);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }

        /* ============================================================
           PAGE 1 — COVER
        ============================================================ */

        /* Hero: dark header with photo + identity */
        .cover-hero {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #0f2744 100%);
            padding: 36px 44px 28px;
            display: flex;
            align-items: center;
            gap: 28px;
            position: relative;
            overflow: hidden;
        }
        .cover-hero::before {
            content: '';
            position: absolute;
            top: -40px; right: -40px;
            width: 220px; height: 220px;
            background: radial-gradient(circle, rgba(20,184,166,0.15) 0%, transparent 70%);
            border-radius: 50%;
        }
        .cover-hero::after {
            content: '';
            position: absolute;
            bottom: -20px; left: 30%;
            width: 300px; height: 150px;
            background: radial-gradient(ellipse, rgba(20,184,166,0.07) 0%, transparent 70%);
        }
        .cover-photo-wrap { flex-shrink: 0; position: relative; z-index: 1; }
        .cover-photo {
            width: 96px; height: 96px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center top;
            border: 3px solid var(--accent);
            background: #334155;
            display: block;
        }
        .cover-photo-ring {
            position: absolute; inset: -6px;
            border-radius: 50%;
            border: 1.5px solid rgba(20,184,166,0.3);
        }
        .cover-identity { flex: 1; position: relative; z-index: 1; }
        .cover-portfolio-label {
            font-size: 7.5pt;
            font-weight: 700;
            letter-spacing: 3.5px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cover-portfolio-label::before {
            content: '';
            width: 24px; height: 2px;
            background: var(--accent);
            display: inline-block;
        }
        .cover-name {
            font-size: 30pt;
            font-weight: 900;
            color: white;
            line-height: 1;
            letter-spacing: -1.5px;
            margin-bottom: 5px;
        }
        .cover-role {
            font-size: 11pt;
            color: #94a3b8;
            font-weight: 400;
            margin-bottom: 14px;
            letter-spacing: 0.2px;
        }
        .cover-contacts {
            display: flex;
            flex-wrap: wrap;
            gap: 5px 16px;
        }
        .cover-contact-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #cbd5e1;
            font-size: 8pt;
            font-weight: 400;
        }
        .cover-contact-icon {
            color: var(--accent);
            font-size: 9pt;
            flex-shrink: 0;
        }

        /* Cover divider line */
        .cover-divider {
            height: 3px;
            background: linear-gradient(90deg, var(--accent) 0%, rgba(20,184,166,0.3) 50%, transparent 100%);
        }

        /* Cover body: bio + skills */
        .cover-body {
            flex: 1;
            padding: 24px 44px 20px;
            display: flex;
            gap: 32px;
        }
        .cover-bio-col { flex: 1.6; }
        .cover-skills-col {
            flex: 1;
            border-left: 1.5px solid var(--border);
            padding-left: 24px;
        }

        .section-overline {
            font-size: 7pt;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--accent-dark);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-overline::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--accent-light);
            max-width: 40px;
        }

        .cover-bio-text {
            font-size: 9pt;
            color: var(--text);
            line-height: 1.65;
            margin-bottom: 20px;
        }

        /* Stats row */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }
        .stat-card {
            background: var(--bg-light);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 6px;
            text-align: center;
        }
        .stat-value {
            font-size: 15pt;
            font-weight: 800;
            color: var(--accent-dark);
            line-height: 1;
            display: block;
        }
        .stat-label {
            font-size: 6.5pt;
            color: var(--text-muted);
            margin-top: 3px;
            display: block;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Chip */
        .chip {
            display: inline-flex;
            align-items: center;
            background: var(--accent-light);
            color: var(--accent-dark);
            padding: 3px 9px;
            border-radius: 20px;
            font-size: 7.5pt;
            font-weight: 600;
        }
        .chip-outline {
            display: inline-flex;
            align-items: center;
            background: var(--bg-light);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 2.5px 8px;
            border-radius: 20px;
            font-size: 7pt;
            font-weight: 500;
        }
        .chips-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        /* Cover footer */
        .cover-footer {
            background: var(--accent);
            padding: 10px 44px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .cover-footer span {
            color: white;
            font-size: 8pt;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .cover-footer .footer-dot {
            width: 4px; height: 4px;
            background: rgba(255,255,255,0.5);
            border-radius: 50%;
            display: inline-block;
            margin: 0 8px;
            vertical-align: middle;
        }

        /* ============================================================
           PROJECT PAGES
        ============================================================ */
        .project-page {
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Project header bar */
        .project-header {
            background: linear-gradient(135deg, #0f172a 0%, #1a2744 100%);
            padding: 10px 30px;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .project-number {
            font-size: 22pt;
            font-weight: 900;
            color: var(--accent);
            opacity: 0.25;
            line-height: 1;
            flex-shrink: 0;
            width: 38px;
            letter-spacing: -2px;
        }
        .project-header-info { flex: 1; min-width: 0; }
        .project-category-badge {
            display: inline-block;
            background: var(--accent);
            color: white;
            padding: 1.5px 8px;
            border-radius: 20px;
            font-size: 5.5pt;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        .project-title {
            font-size: 13.5pt;
            font-weight: 800;
            color: white;
            line-height: 1.1;
            margin-bottom: 1px;
            letter-spacing: -0.5px;
        }
        .project-subtitle {
            font-size: 7.5pt;
            color: #94a3b8;
            font-weight: 400;
        }
        .project-url-pill {
            flex-shrink: 0;
            color: var(--accent);
            font-size: 7pt;
            font-weight: 600;
            background: rgba(20,184,166,0.1);
            border: 1px solid rgba(20,184,166,0.3);
            padding: 3px 9px;
            border-radius: 20px;
            white-space: nowrap;
        }

        /* Project body */
        .project-body {
            flex: 1;
            padding: 14px 36px 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 10px;
            min-height: 0;
        }

        /* Screenshot Browser Mockup Frame */
        .project-screenshot {
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #334155;
            box-shadow: 0 3px 10px rgba(0,0,0,0.12);
            background: #0f172a;
            position: relative;
            width: 100%;
            flex-shrink: 0;
        }
        .browser-bar {
            background: #1e293b;
            padding: 4px 8px;
            display: flex;
            align-items: center;
            gap: 4px;
            border-bottom: 1px solid #334155;
        }
        .browser-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }
        .browser-dot.red { background: #ef4444; }
        .browser-dot.yellow { background: #f59e0b; }
        .browser-dot.green { background: #10b981; }
        .browser-url-text {
            margin-left: 6px;
            font-size: 5.5pt;
            color: #94a3b8;
            background: #0f172a;
            padding: 1px 6px;
            border-radius: 3px;
            border: 1px solid #334155;
            flex: 1;
            max-width: 240px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: monospace;
        }
        .browser-img-wrap {
            width: 100%;
            height: 130px;
            overflow: hidden;
            background: #0f172a;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }
        .browser-img-wrap img {
            width: 100%;
            height: auto;
            min-height: 100%;
            object-fit: cover;
            object-position: top center;
            display: block;
        }
        .screenshot-overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(15,23,42,0.85));
            padding: 4px 8px 3px;
        }
        .screenshot-caption {
            font-size: 6pt;
            color: rgba(255,255,255,0.9);
            font-weight: 500;
            font-style: italic;
        }

        /* Extra images under Project Overview */
        .extra-images-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
            gap: 5px;
            margin-top: 3px;
        }
        .extra-img-card {
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: #0f172a;
        }
        .extra-img-card img {
            width: 100%;
            height: 40px;
            object-fit: cover;
            object-position: top center;
            display: block;
        }
        .extra-img-caption {
            display: block;
            padding: 2px 4px;
            font-size: 5.5pt;
            color: var(--text-muted);
            line-height: 1.15;
            font-weight: 500;
        }

        /* Content row: left col + right col */
        .project-content-row {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 12px;
            flex: 1;
            min-height: 0;
        }

        /* Info block */
        .info-block { margin-bottom: 10px; }
        .info-block:last-child { margin-bottom: 0; }
        .info-heading {
            font-size: 6.5pt;
            font-weight: 700;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            color: var(--accent-dark);
            margin-bottom: 6px;
            padding-bottom: 4px;
            border-bottom: 1.5px solid var(--accent-light);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .info-heading::before {
            content: '';
            width: 10px; height: 2px;
            background: var(--accent);
            border-radius: 2px;
        }
        .overview-text {
            font-size: 8pt;
            color: var(--text);
            line-height: 1.55;
        }

        /* CS Items */
        .cs-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .cs-item {
            background: var(--bg-light);
            border-left: 2.5px solid var(--accent);
            border-radius: 0 5px 5px 0;
            padding: 4.5px 8px;
        }
        .cs-challenge {
            font-size: 7pt;
            color: var(--text-muted);
            margin-bottom: 2px;
            line-height: 1.35;
        }
        .cs-challenge-label {
            font-size: 5.5pt;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: #d97706;
            margin-bottom: 1px;
        }
        .cs-solution {
            font-size: 7pt;
            color: var(--text);
            font-weight: 500;
            line-height: 1.35;
        }
        .cs-solution-label {
            font-size: 5.5pt;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--accent-dark);
            margin-top: 3px;
            margin-bottom: 1px;
        }

        /* Impact section */
        .impact-section {
            background: linear-gradient(135deg, var(--primary) 0%, #1a2744 100%);
            border-radius: 6px;
            padding: 8px 14px;
            flex-shrink: 0;
        }
        .impact-heading {
            font-size: 6.5pt;
            font-weight: 700;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .impact-heading::before {
            content: '★';
            font-size: 7.5pt;
        }
        .impact-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        .impact-item {
            background: rgba(20,184,166,0.1);
            border: 1px solid rgba(20,184,166,0.22);
            border-radius: 4px;
            padding: 3px 8px;
            font-size: 7pt;
            color: #e2e8f0;
            font-weight: 500;
        }
        .impact-item::before {
            content: '→ ';
            color: var(--accent);
            font-weight: 700;
        }

        /* Project meta footer */
        .project-meta {
            background: var(--bg-light);
            border-top: 1px solid var(--border);
            padding: 6px 36px;
            display: flex;
            gap: 24px;
            align-items: center;
            flex-shrink: 0;
        }
        .meta-pair { display: flex; flex-direction: column; gap: 1px; }
        .meta-key {
            font-size: 5.5pt;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--text-muted);
        }
        .meta-val {
            font-size: 7pt;
            color: var(--text);
            font-weight: 600;
        }
        .meta-sep {
            width: 1px;
            height: 20px;
            background: var(--border);
        }

        /* ============================================================
           OTHER PROJECTS PAGE
        ============================================================ */
        .other-page {
            height: 297mm;
            max-height: 297mm;
            box-sizing: border-box;
            overflow: hidden;
        }

        .other-page-header {
            background: linear-gradient(135deg, #0f172a 0%, #1a2744 100%);
            padding: 20px 36px;
            position: relative;
            overflow: hidden;
        }
        .other-page-header::after {
            content: '';
            position: absolute;
            top: -40px; right: -20px;
            width: 160px; height: 160px;
            background: radial-gradient(circle, rgba(20,184,166,0.15) 0%, transparent 70%);
            border-radius: 50%;
        }
        .other-sub-label {
            font-size: 7pt;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 4px;
        }
        .other-main-title {
            font-size: 18pt;
            font-weight: 800;
            color: white;
            letter-spacing: -0.5px;
        }

        .other-projects-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 16px 36px;
            flex: 1;
            align-content: start;
        }

        .other-card {
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            background: white;
        }
        .other-card-img {
            width: 100%;
            height: 70px;
            object-fit: cover;
            object-position: top;
            display: block;
            background: var(--bg-light);
        }
        .other-card-body { padding: 8px 10px; }
        .other-card-category {
            font-size: 6.5pt;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--accent-dark);
            margin-bottom: 3px;
        }
        .other-card-title {
            font-size: 10pt;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 5px;
            line-height: 1.2;
        }
        .other-card-desc {
            font-size: 7.5pt;
            color: var(--text-muted);
            line-height: 1.55;
            margin-bottom: 8px;
        }
        .other-card-tech {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 7px;
        }
        .other-tech-chip {
            background: var(--bg-light);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 2px 7px;
            border-radius: 12px;
            font-size: 6.5pt;
            font-weight: 500;
        }
        .other-card-url {
            font-size: 7pt;
            color: var(--accent-dark);
            font-weight: 600;
            text-decoration: none;
        }

        /* Last page footer */
        .page-footer {
            background: var(--primary);
            padding: 16px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .page-footer-left { color: #94a3b8; font-size: 7.5pt; }
        .page-footer-right {
            color: var(--accent);
            font-size: 7.5pt;
            font-weight: 600;
        }

        /* ============================================================
           LOADING STATE
        ============================================================ */
        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            gap: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <!-- ── PRINT BAR (screen only) ── -->
    <div class="print-bar no-print" id="print-bar">
        <div class="print-bar-left">
            <img class="print-bar-logo" id="print-bar-logo" src="images/intro-bg.png" alt="Michail" onerror="this.style.display='none'">
            <div>
                <h2 id="print-bar-name">Portfolio — Michail Tjhang</h2>
                <p>Full-Stack Web Developer · Portfolio PDF Preview</p>
            </div>
        </div>
        <div class="print-bar-actions">
            <a href="index.html" class="btn-back no-print">← Back to Website</a>
            <button class="btn-print" onclick="window.print()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="8 17 12 21 16 17"></polyline>
                    <line x1="12" y1="12" x2="12" y2="21"></line>
                    <path d="M20.88 18.09A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.29"></path>
                </svg>
                Save as PDF / Print
            </button>
        </div>
    </div>

    <!-- ── PAGES WRAPPER ── -->
    <div class="pages-wrapper" id="pages-wrapper">
        <div id="cover-container"></div>
        <div id="projects-container"></div>
        <div id="other-container"></div>
    </div>

    <!-- ── DATA ── -->
    <script src="portfolio-content.js"></script>

    <!-- ── RENDER ENGINE ── -->
    <script>
    (function () {
        'use strict';

        const D = PORTFOLIO_CONTENT;

        /* ── Helpers ─────────────────────────────────────────────── */
        const esc = s => String(s)
            .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

        function chips(arr, cls = 'chip') {
            return arr.map(t => `<span class="${cls}">${esc(t)}</span>`).join('');
        }

        /* ── COVER PAGE ──────────────────────────────────────────── */
        function renderCover() {
            const p = D.profile;

            const contacts = [
                { icon: '✉', text: p.email },
                { icon: 'in', text: p.linkedin },
                { icon: '⌥', text: p.github },
                { icon: '◎', text: p.location }
            ];

            const contactHtml = contacts.map(c =>
                `<span class="cover-contact-item">
                    <span class="cover-contact-icon">${esc(c.icon)}</span>
                    ${esc(c.text)}
                </span>`
            ).join('');

            const statsHtml = (p.highlights || []).map(h =>
                `<div class="stat-card">
                    <span class="stat-value">${esc(h.value)}</span>
                    <span class="stat-label">${esc(h.label)}</span>
                </div>`
            ).join('');

            const skillChips = chips(p.coreSkills, 'chip');

            const html = `
            <div class="pdf-page">

                <div class="cover-hero">
                    <div class="cover-photo-wrap">
                        <img class="cover-photo" src="${esc(p.photo)}" alt="${esc(p.fullName)}"
                             onerror="this.src='';this.style.background='#334155'">
                        <div class="cover-photo-ring"></div>
                    </div>
                    <div class="cover-identity">
                        <p class="cover-portfolio-label">Web Developer Portfolio</p>
                        <h1 class="cover-name">${esc(p.fullName)}</h1>
                        <p class="cover-role">${esc(p.role)}</p>
                        <div class="cover-contacts">${contactHtml}</div>
                    </div>
                </div>

                <div class="cover-divider"></div>

                <div class="cover-body">
                    <div class="cover-bio-col">
                        <p class="section-overline">About</p>
                        <p class="cover-bio-text">${esc(p.bio)}</p>
                        <div class="stats-row">${statsHtml}</div>
                    </div>
                    <div class="cover-skills-col">
                        <p class="section-overline">Core Technologies</p>
                        <div class="chips-wrap" style="gap:6px;">${skillChips}</div>
                    </div>
                </div>

                <div class="cover-footer">
                    <span>${esc(p.website)}</span>
                    <span><span class="footer-dot"></span>Portfolio ${new Date().getFullYear()}<span class="footer-dot"></span>Full-Stack Web Developer</span>
                </div>

            </div>`;

            document.getElementById('cover-container').innerHTML = html;
            document.getElementById('print-bar-name').textContent = `Portfolio — ${p.fullName}`;
        }

        /* ── PROJECT PAGE ────────────────────────────────────────── */
        function renderProject(proj) {

            /* Screenshots */
            const mainImg = proj.images[0];
            const extraImgs = proj.images.slice(1);

            const mainScreenshotHtml = `
                <div class="project-screenshot">
                    <div class="browser-bar">
                        <span class="browser-dot red"></span>
                        <span class="browser-dot yellow"></span>
                        <span class="browser-dot green"></span>
                        <span class="browser-url-text">${esc(proj.urlDisplay || proj.url)}</span>
                    </div>
                    <div class="browser-img-wrap">
                        <img src="${esc(mainImg.src)}" alt="${esc(mainImg.caption)}"
                             onerror="this.style.opacity='0.3'">
                    </div>
                    ${mainImg.caption ? `
                    <div class="screenshot-overlay">
                        <span class="screenshot-caption">${esc(mainImg.caption)}</span>
                    </div>` : ''}
                </div>`;

            const extraImagesHtml = extraImgs.length ? `
                <div class="info-block" style="margin-top: 10px;">
                    <div class="info-heading">Project Gallery / Additional Views</div>
                    <div class="extra-images-grid">
                        ${extraImgs.map(img => `
                            <div class="extra-img-card">
                                <img src="${esc(img.src)}" alt="${esc(img.caption)}" onerror="this.style.opacity='0.3'">
                                ${img.caption ? `<span class="extra-img-caption">${esc(img.caption)}</span>` : ''}
                            </div>`).join('')}
                    </div>
                </div>` : '';

            /* Tech */
            const techHtml = chips(proj.tech, 'chip-outline');

            /* Challenge-Solution items */
            const csHtml = proj.challengesSolutions.map(cs => `
                <li class="cs-item">
                    <div class="cs-challenge-label">⚠ Challenge</div>
                    <div class="cs-challenge">${esc(cs.challenge)}</div>
                    <div class="cs-solution-label">✓ Solution</div>
                    <div class="cs-solution">${esc(cs.solution)}</div>
                </li>`).join('');

            /* Impact */
            const impactHtml = proj.impact.map(i => `<div class="impact-item">${esc(i)}</div>`).join('');

            return `
            <div class="pdf-page project-page">

                <div class="project-header">
                    <div class="project-number">${esc(proj.number)}</div>
                    <div class="project-header-info">
                        <span class="project-category-badge">${esc(proj.category)}</span>
                        <h2 class="project-title">${esc(proj.title)}</h2>
                        <p class="project-subtitle">${esc(proj.subtitle)}</p>
                    </div>
                    <span class="project-url-pill">⇒ ${esc(proj.urlDisplay)}</span>
                </div>

                <div class="project-body">

                    ${mainScreenshotHtml}

                    <div class="project-content-row">
                        <div class="project-col-left">
                            <div class="info-block">
                                <div class="info-heading">Tech Stack</div>
                                <div class="chips-wrap">${techHtml}</div>
                            </div>
                            <div class="info-block">
                                <div class="info-heading">Project Overview</div>
                                <p class="overview-text">${esc(proj.overview)}</p>
                            </div>
                            ${extraImagesHtml}
                        </div>
                        <div class="project-col-right">
                            <div class="info-block">
                                <div class="info-heading">Challenges &amp; Solutions</div>
                                <ul class="cs-list">${csHtml}</ul>
                            </div>
                        </div>
                    </div>

                    <div class="impact-section">
                        <div class="impact-heading">Key Results &amp; Impact</div>
                        <div class="impact-grid">${impactHtml}</div>
                    </div>

                </div>

                <div class="project-meta">
                    <div class="meta-pair">
                        <span class="meta-key">Period</span>
                        <span class="meta-val">${esc(proj.period)}</span>
                    </div>
                    <div class="meta-sep"></div>
                    <div class="meta-pair">
                        <span class="meta-key">Role</span>
                        <span class="meta-val">${esc(proj.role)}</span>
                    </div>
                    <div class="meta-sep"></div>
                    <div class="meta-pair">
                        <span class="meta-key">Live URL</span>
                        <span class="meta-val">${esc(proj.url)}</span>
                    </div>
                </div>

            </div>`;
        }

        /* ── OTHER PROJECTS PAGE ─────────────────────────────────── */
        function renderOther() {
            const p = D.profile;

            const cardsHtml = D.otherProjects.map(proj => {
                const techHtml = proj.tech.map(t => `<span class="other-tech-chip">${esc(t)}</span>`).join('');
                return `
                <div class="other-card">
                    <img class="other-card-img" src="${esc(proj.image)}" alt="${esc(proj.title)}"
                         onerror="this.style.opacity='0.2'">
                    <div class="other-card-body">
                        <p class="other-card-category">${esc(proj.category)}</p>
                        <h3 class="other-card-title">${esc(proj.title)}</h3>
                        <p class="other-card-desc">${esc(proj.description)}</p>
                        <div class="other-card-tech">${techHtml}</div>
                        <span class="other-card-url">⇒ ${esc(proj.url)}</span>
                    </div>
                </div>`;
            }).join('');

            const html = `
            <div class="pdf-page other-page">
                <div class="other-page-header">
                    <p class="other-sub-label">Additional Work</p>
                    <h2 class="other-main-title">Other Projects</h2>
                </div>
                <div class="other-projects-grid">${cardsHtml}</div>
                <div class="page-footer">
                    <span class="page-footer-left">${esc(p.fullName)} · ${esc(p.role)}</span>
                    <span class="page-footer-right">${esc(p.email)} · ${esc(p.website)}</span>
                </div>
            </div>`;

            document.getElementById('other-container').innerHTML = html;
        }

        /* ── INIT ────────────────────────────────────────────────── */
        function init() {
            renderCover();

            const projectsHtml = D.mainProjects.map(proj => renderProject(proj)).join('');
            document.getElementById('projects-container').innerHTML = projectsHtml;

            renderOther();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

    })();
    </script>

</body>
</html>
